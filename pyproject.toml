[project]
name = "anveshak"
version = "0.1.0"
description = "Smart scan scheduler for Electronic Support receivers (SIH 2026, SIH26055)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "xgboost>=3.0",
    "scikit-learn>=1.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "matplotlib>=3.9",
    "python-pptx>=1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
